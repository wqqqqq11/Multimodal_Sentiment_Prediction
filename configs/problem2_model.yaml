        {"name": "vision_20_middle", "pattern": "vision", "rate": 0.20, "position": "middle", "weight": 0.20},
        {"name": "audio_vision_20_begin", "pattern": "audio_vision", "rate": 0.20, "position": "begin", "weight": 0.20},
        {"name": "audio_vision_20_middle", "pattern": "audio_vision", "rate": 0.20, "position": "middle", "weight": 0.20},
        {"name": "audio_vision_20_end", "pattern": "audio_vision", "rate": 0.20, "position": "end", "weight": 0.20}
      ]
    },
    "stress_scenario": {
      "pattern": "all_modalities",
      "rate": 0.30,
      "position": "middle"
    }
  }
