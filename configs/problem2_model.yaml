  "model": {
    "vocab_size": 30522,
    "max_steps": 50,
    "audio_dim": 74,
    "vision_dim": 35,
    "hidden_dim": 128,
    "fusion_dim": 192,
    "text_layers": 2,
    "text_heads": 4,
    "dropout": 0.25,
    "num_classes": 3,
    "gate_reliability_gamma": 0.80
    ,"privileged_text_dim": 768,
    "text_residual_weight": 0.65
