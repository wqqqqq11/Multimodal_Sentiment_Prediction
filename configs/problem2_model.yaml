  "training": {
    "teacher_epochs": 30,
    "text_distill_epochs": 15,
    "student_epochs": 30,
    "teacher_lr": 0.0003,
    "text_distill_lr": 0.00025,
    "student_lr": 0.000125,
    "weight_decay": 0.0001,
    "gradient_clip": 1.0,
    "patience": 5,
    "min_delta": 0.0001,
    "missing_view_probability": 0.50,
