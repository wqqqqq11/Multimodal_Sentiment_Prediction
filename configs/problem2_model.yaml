{
  "project": {
    "name": "MRCD-Net",
    "seed": 2026,
    "description": "Mask-aware Reliability-gated Complete-to-Missing Distillation Network"
  },
  "paths": {
    "preprocessed_root": "datasets/preprocessed_data/problem2",
    "output_root": "outputs/problem2",
    "strategy_document": "strategy/problem2_modeling.md",
    "privileged_text_init": "datasets/preprocessed_data/problem2/text_privileged_init.npz"
  },
  "data": {
    "train_file": "train.npz",
    "valid_file": "valid.npz",
    "test_file": "test.npz",
