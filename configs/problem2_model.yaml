    "synchronized_include_text": false,
    "synchronized_rate_min": 0.15,
    "synchronized_rate_max": 0.40,
    "class_weights": [1.1703, 1.4930, 0.6776],
    "loss_weights": {
      "classification": 1.0,
      "regression": 1.0,
      "correlation": 0.20,
      "coherence": 0.10,
      "text_aux_classification": 0.35,
      "text_aux_regression": 0.25,
      "kd_classification": 0.80,
      "kd_regression": 0.50,
      "kd_feature": 0.30,
      "kd_modality": 0.25,
      "kd_relation": 0.10,
      "kd_gate": 0.10
