  "evaluation": {
    "missing_rates": [0.10, 0.20, 0.30, 0.40, 0.48],
    "missing_patterns": ["text", "audio", "vision", "audio_vision", "all_modalities"],
    "missing_positions": ["begin", "middle", "end"],
    "primary_position": "middle",
    "bootstrap_samples": 200,
    "selection": {
      "complete_weight": 0.60,
      "robust_weight": 0.40,
      "scenarios": [
